name: sports-intelligence-os

x-backend-environment: &backend-environment
  SIO_ENVIRONMENT: ${SIO_ENVIRONMENT:-development}
  SIO_APP_NAME: ${SIO_APP_NAME:-Content Intelligence OS}
  SIO_LOG_LEVEL: ${SIO_LOG_LEVEL:-INFO}
  SIO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sio}:${POSTGRES_PASSWORD:-sio-local-development-only}@postgres:5432/${POSTGRES_DB:-sports_intelligence}
  SIO_REDIS_URL: redis://redis:6379/0
  SIO_DATABASE_POOL_SIZE: ${SIO_DATABASE_POOL_SIZE:-10}
  SIO_DATABASE_MAX_OVERFLOW: ${SIO_DATABASE_MAX_OVERFLOW:-20}
  SIO_DATABASE_POOL_TIMEOUT_SECONDS: ${SIO_DATABASE_POOL_TIMEOUT_SECONDS:-30}
  SIO_DATABASE_POOL_RECYCLE_SECONDS: ${SIO_DATABASE_POOL_RECYCLE_SECONDS:-1800}
  SIO_DATABASE_COMMAND_TIMEOUT_SECONDS: ${SIO_DATABASE_COMMAND_TIMEOUT_SECONDS:-60}
  SIO_REDIS_CONNECT_TIMEOUT_SECONDS: ${SIO_REDIS_CONNECT_TIMEOUT_SECONDS:-5}
  SIO_REDIS_SOCKET_TIMEOUT_SECONDS: ${SIO_REDIS_SOCKET_TIMEOUT_SECONDS:-5}
  SIO_REDIS_MAX_CONNECTIONS: ${SIO_REDIS_MAX_CONNECTIONS:-50}
  SIO_REDIS_HEALTH_CHECK_INTERVAL_SECONDS: ${SIO_REDIS_HEALTH_CHECK_INTERVAL_SECONDS:-30}
  SIO_REDIS_RETRY_ON_TIMEOUT: ${SIO_REDIS_RETRY_ON_TIMEOUT:-true}
  SIO_SECRET_KEY: ${SIO_SECRET_KEY:-local-development-secret-replace-before-production-2026}
  SIO_SESSION_COOKIE_NAME: ${SIO_SESSION_COOKIE_NAME:-sio_session}
  SIO_SESSION_COOKIE_SECURE: ${SIO_SESSION_COOKIE_SECURE:-false}
  SIO_SESSION_TTL_SECONDS: ${SIO_SESSION_TTL_SECONDS:-86400}
  SIO_AUTH_LOGIN_WINDOW_SECONDS: ${SIO_AUTH_LOGIN_WINDOW_SECONDS:-900}
  SIO_AUTH_LOGIN_MAX_ATTEMPTS_PER_IDENTITY: ${SIO_AUTH_LOGIN_MAX_ATTEMPTS_PER_IDENTITY:-10}
  SIO_AUTH_LOGIN_MAX_ATTEMPTS_PER_IP: ${SIO_AUTH_LOGIN_MAX_ATTEMPTS_PER_IP:-100}
  SIO_AUTH_ATTEMPT_RETENTION_SECONDS: ${SIO_AUTH_ATTEMPT_RETENTION_SECONDS:-604800}
  SIO_SESSION_CLEANUP_RETENTION_SECONDS: ${SIO_SESSION_CLEANUP_RETENTION_SECONDS:-604800}
  SIO_PASSWORD_MIN_LENGTH: ${SIO_PASSWORD_MIN_LENGTH:-12}
  SIO_CORS_ORIGINS: '${SIO_CORS_ORIGINS:-["http://localhost:8080","http://localhost:3000","http://127.0.0.1:3000"]}'
  SIO_BOOTSTRAP_ADMIN_EMAIL: ${SIO_BOOTSTRAP_ADMIN_EMAIL:-}
  SIO_BOOTSTRAP_ADMIN_PASSWORD: ${SIO_BOOTSTRAP_ADMIN_PASSWORD:-}
  SIO_BOOTSTRAP_WORKSPACE_NAME: ${SIO_BOOTSTRAP_WORKSPACE_NAME:-Content Intelligence OS}
  SIO_YOUTUBE_API_KEY: ${SIO_YOUTUBE_API_KEY:-}
  SIO_YOUTUBE_SEARCH_DAILY_BUDGET: ${SIO_YOUTUBE_SEARCH_DAILY_BUDGET:-80}
  SIO_YOUTUBE_GENERAL_DAILY_BUDGET: ${SIO_YOUTUBE_GENERAL_DAILY_BUDGET:-5000}
  SIO_YOUTUBE_CHART_REFRESH_SECONDS: ${SIO_YOUTUBE_CHART_REFRESH_SECONDS:-14400}
  SIO_TIKTOK_CLIENT_KEY: ${SIO_TIKTOK_CLIENT_KEY:-}
  SIO_TIKTOK_CLIENT_SECRET: ${SIO_TIKTOK_CLIENT_SECRET:-}
  SIO_TIKTOK_ACCESS_TOKEN: ${SIO_TIKTOK_ACCESS_TOKEN:-}
  SIO_TIKTOK_REFRESH_TOKEN: ${SIO_TIKTOK_REFRESH_TOKEN:-}
  SIO_DOUYIN_CLIENT_KEY: ${SIO_DOUYIN_CLIENT_KEY:-}
  SIO_DOUYIN_CLIENT_SECRET: ${SIO_DOUYIN_CLIENT_SECRET:-}
  SIO_DOUYIN_ACCESS_TOKEN: ${SIO_DOUYIN_ACCESS_TOKEN:-}
  SIO_DOUYIN_REFRESH_TOKEN: ${SIO_DOUYIN_REFRESH_TOKEN:-}
  SIO_VIDEO_SEARCH_ENABLED: ${SIO_VIDEO_SEARCH_ENABLED:-true}
  SIO_VIDEO_SEARCH_DEFAULT_INTERVAL_SECONDS: ${SIO_VIDEO_SEARCH_DEFAULT_INTERVAL_SECONDS:-3600}
  SIO_VIDEO_SEARCH_MAX_CANDIDATES_PER_RUN: ${SIO_VIDEO_SEARCH_MAX_CANDIDATES_PER_RUN:-20}
  SIO_VIDEO_SEARCH_ANALYZER: ${SIO_VIDEO_SEARCH_ANALYZER:-none}
  SIO_VIDEO_SEARCH_REQUEST_TIMEOUT_SECONDS: ${SIO_VIDEO_SEARCH_REQUEST_TIMEOUT_SECONDS:-180}
  SIO_VIDEO_SEARCH_MAX_UPLOAD_BYTES: ${SIO_VIDEO_SEARCH_MAX_UPLOAD_BYTES:-100000000}
  SIO_GEMINI_API_KEY: ${SIO_GEMINI_API_KEY:-}
  SIO_GEMINI_VIDEO_MODEL: ${SIO_GEMINI_VIDEO_MODEL:-gemini-3.6-flash}
  # 本地语义检索（pgvector + 自托管 embedding，不依赖外部 LLM）
  SIO_SEMANTIC_SEARCH_ENABLED: ${SIO_SEMANTIC_SEARCH_ENABLED:-false}
  SIO_EMBEDDING_BACKEND: ${SIO_EMBEDDING_BACKEND:-none}
  SIO_EMBEDDING_BASE_URL: ${SIO_EMBEDDING_BASE_URL:-http://embeddings:80}
  SIO_EMBEDDING_API_KEY: ${SIO_EMBEDDING_API_KEY:-}
  SIO_EMBEDDING_MODEL: ${SIO_EMBEDDING_MODEL:-BAAI/bge-m3}
  SIO_EMBEDDING_DIMENSION: ${SIO_EMBEDDING_DIMENSION:-1024}
  SIO_EMBEDDING_BATCH_SIZE: ${SIO_EMBEDDING_BATCH_SIZE:-16}
  SIO_EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${SIO_EMBEDDING_REQUEST_TIMEOUT_SECONDS:-60}
  SIO_EMBEDDING_CHUNK_CHARS: ${SIO_EMBEDDING_CHUNK_CHARS:-700}
  SIO_EMBEDDING_CHUNK_OVERLAP_CHARS: ${SIO_EMBEDDING_CHUNK_OVERLAP_CHARS:-100}
  SIO_EMBEDDING_MAX_CHUNKS_PER_ITEM: ${SIO_EMBEDDING_MAX_CHUNKS_PER_ITEM:-200}
  SIO_PLATFORM_REQUEST_TIMEOUT_SECONDS: ${SIO_PLATFORM_REQUEST_TIMEOUT_SECONDS:-10}
  SIO_PLATFORM_REQUEST_MAX_ATTEMPTS: ${SIO_PLATFORM_REQUEST_MAX_ATTEMPTS:-3}
  SIO_PLATFORM_CANARY_ENABLED: ${SIO_PLATFORM_CANARY_ENABLED:-true}
  SIO_PLATFORM_CANARY_INTERVAL_SECONDS: ${SIO_PLATFORM_CANARY_INTERVAL_SECONDS:-3600}
  SIO_HOTSPOT_FEED_MAX_SOURCES: ${SIO_HOTSPOT_FEED_MAX_SOURCES:-20}
  SIO_HOTSPOT_FEED_ITEMS_PER_SOURCE: ${SIO_HOTSPOT_FEED_ITEMS_PER_SOURCE:-50}
  SIO_HOTSPOT_FEED_CONCURRENCY: ${SIO_HOTSPOT_FEED_CONCURRENCY:-4}
  SIO_HOTSPOT_SPORT_QUERY_CONCURRENCY: ${SIO_HOTSPOT_SPORT_QUERY_CONCURRENCY:-3}
  SIO_HOTSPOT_SPORT_MAX_QUERIES_PER_LANE: ${SIO_HOTSPOT_SPORT_MAX_QUERIES_PER_LANE:-1}
  SIO_HOTSPOT_MAINSTREAM_TARGET_ITEMS: ${SIO_HOTSPOT_MAINSTREAM_TARGET_ITEMS:-50}
  SIO_HOTSPOT_GENERAL_TARGET_ITEMS: ${SIO_HOTSPOT_GENERAL_TARGET_ITEMS:-10}
  SIO_SYNC_TASK_MAX_RETRIES: ${SIO_SYNC_TASK_MAX_RETRIES:-3}
  SIO_TASK_STALE_AFTER_SECONDS: ${SIO_TASK_STALE_AFTER_SECONDS:-2100}
  # Keep clean installs on the safe bounded monitoring default. Historical
  # backfills remain an explicit workspace/account setting.
  SIO_SYNC_PAGE_LIMIT: ${SIO_SYNC_PAGE_LIMIT:-40}
  SIO_YTDLP_NODE_PATH: ${SIO_YTDLP_NODE_PATH:-/usr/local/bin/node}
  SIO_YTDLP_REMOTE_COMPONENTS: ${SIO_YTDLP_REMOTE_COMPONENTS:-}
  SIO_YTDLP_ALLOW_RUNTIME_UPDATE: ${SIO_YTDLP_ALLOW_RUNTIME_UPDATE:-false}
  SIO_BROWSER_CDP_ENDPOINT: ${SIO_BROWSER_CDP_ENDPOINT:-http://browser:9222}
  SIO_BROWSER_VNC_URL: ${SIO_BROWSER_VNC_URL:-http://localhost:6080/vnc.html?autoconnect=1&resize=scale}
  SIO_NEWS_SSRF_CHECK_ENABLED: ${SIO_NEWS_SSRF_CHECK_ENABLED:-true}
  SIO_LLM_OPENAI_COMPATIBLE_BASE_URL: ${SIO_LLM_OPENAI_COMPATIBLE_BASE_URL:-}
  SIO_LLM_OPENAI_COMPATIBLE_API_KEY: ${SIO_LLM_OPENAI_COMPATIBLE_API_KEY:-}
  SIO_LLM_DEFAULT_MODEL: ${SIO_LLM_DEFAULT_MODEL:-gpt-5.6-terra}
  SIO_LLM_DEFAULT_TEMPERATURE: ${SIO_LLM_DEFAULT_TEMPERATURE:-0.4}
  SIO_LLM_DEFAULT_TOP_P: ${SIO_LLM_DEFAULT_TOP_P:-1.0}
  SIO_LLM_DEFAULT_MAX_TOKENS: ${SIO_LLM_DEFAULT_MAX_TOKENS:-8192}
  SIO_LLM_REQUEST_TIMEOUT_SECONDS: ${SIO_LLM_REQUEST_TIMEOUT_SECONDS:-90}
  SIO_LLM_REQUEST_MAX_ATTEMPTS: ${SIO_LLM_REQUEST_MAX_ATTEMPTS:-3}
  SIO_LLM_INTERNAL_HOSTS_ALLOWLIST: '["llm-gateway","llm-experimental","host.docker.internal"]'
  SIO_BROWSER_FIRST_MODE: ${SIO_BROWSER_FIRST_MODE:-false}
  SIO_LLM_FALLBACK_BASE_URL: ${SIO_LLM_FALLBACK_BASE_URL:-}
  SIO_NOTIFICATION_ENCRYPTION_KEY: ${SIO_NOTIFICATION_ENCRYPTION_KEY:-}
  SIO_NOTIFICATION_REQUEST_TIMEOUT_SECONDS: ${SIO_NOTIFICATION_REQUEST_TIMEOUT_SECONDS:-10}
  SIO_NOTIFICATION_REQUEST_MAX_ATTEMPTS: ${SIO_NOTIFICATION_REQUEST_MAX_ATTEMPTS:-3}
  SIO_MEDIA_ROOT: ${SIO_MEDIA_ROOT:-/workspace/media}
  SIO_MEDIA_STORAGE_QUOTA_BYTES: ${SIO_MEDIA_STORAGE_QUOTA_BYTES:-}
  SIO_MEDIA_STORAGE_SCAN_MAX_FILES: ${SIO_MEDIA_STORAGE_SCAN_MAX_FILES:-100000}
  # Lifecycle cleanup is opt-in and remains a dry run until explicitly changed.
  SIO_MEDIA_LIFECYCLE_ENABLED: ${SIO_MEDIA_LIFECYCLE_ENABLED:-false}
  SIO_MEDIA_LIFECYCLE_DRY_RUN: ${SIO_MEDIA_LIFECYCLE_DRY_RUN:-true}
  SIO_MEDIA_RETENTION_DAYS: ${SIO_MEDIA_RETENTION_DAYS:-30}
  SIO_MEDIA_ORPHAN_RETENTION_DAYS: ${SIO_MEDIA_ORPHAN_RETENTION_DAYS:-7}
  SIO_MEDIA_LIFECYCLE_BATCH_SIZE: ${SIO_MEDIA_LIFECYCLE_BATCH_SIZE:-200}
  SIO_SUBTITLE_ASR_ENABLED: ${SIO_SUBTITLE_ASR_ENABLED:-true}
  SIO_SUBTITLE_ASR_BACKEND: ${SIO_SUBTITLE_ASR_BACKEND:-faster_whisper}
  SIO_SUBTITLE_ASR_MODEL: ${SIO_SUBTITLE_ASR_MODEL:-small}
  SIO_SUBTITLE_ASR_DEVICE: ${SIO_SUBTITLE_ASR_DEVICE:-auto}
  SIO_SUBTITLE_ASR_COMPUTE_TYPE: ${SIO_SUBTITLE_ASR_COMPUTE_TYPE:-int8}
  SIO_SUBTITLE_ASR_MODEL_DIR: ${SIO_SUBTITLE_ASR_MODEL_DIR:-/workspace/models/whisper}
  SIO_SUBTITLE_ASR_MAX_FILE_BYTES: ${SIO_SUBTITLE_ASR_MAX_FILE_BYTES:-4000000000}
  SIO_SUBTITLE_ASR_MAX_DURATION_SECONDS: ${SIO_SUBTITLE_ASR_MAX_DURATION_SECONDS:-7200}
  SIO_SUBTITLE_ASR_BEAM_SIZE: ${SIO_SUBTITLE_ASR_BEAM_SIZE:-5}
  SIO_SUBTITLE_TRANSLATION_BACKEND: ${SIO_SUBTITLE_TRANSLATION_BACKEND:-http}
  SIO_SUBTITLE_TRANSLATION_BASE_URL: ${SIO_SUBTITLE_TRANSLATION_BASE_URL:-http://translation:5000}
  SIO_SUBTITLE_TRANSLATION_API_KEY: ${SIO_SUBTITLE_TRANSLATION_API_KEY:-}
  SIO_SUBTITLE_TRANSLATION_TIMEOUT_SECONDS: ${SIO_SUBTITLE_TRANSLATION_TIMEOUT_SECONDS:-120}
  SIO_SUBTITLE_TRANSLATION_MAX_SEGMENTS: ${SIO_SUBTITLE_TRANSLATION_MAX_SEGMENTS:-2000}

services:
  postgres:
    # postgres:17-alpine + 自编译 pgvector（见 deploy/postgres.Dockerfile 顶部注释）
    build:
      context: .
      dockerfile: deploy/postgres.Dockerfile
    image: sports-intelligence-os-postgres:17-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sports_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-sio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sio-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment: *backend-environment
    command:
      - /bin/sh
      - -c
      - cd apps/api && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      # NOTE: host port 8000 was unreachable because Windows (Hyper-V/WinNAT)
      # reserves TCP 7998-8097. Using 18000 (outside the reserved range).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/workspace/data:ro
      - ./media:/workspace/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  browser:
    build:
      context: .
      dockerfile: deploy/browser.Dockerfile
    environment:
      DISPLAY: ${SIO_BROWSER_DISPLAY:-:99}
      PLAYWRIGHT_BROWSERS_PATH: /opt/browsers
      SIO_BROWSER_PROFILE_DIR: /workspace/browser-profile
      SIO_BROWSER_CDP_PORT: ${SIO_BROWSER_CDP_PORT:-9222}
      SIO_BROWSER_CHROME_CDP_PORT: ${SIO_BROWSER_CHROME_CDP_PORT:-9223}
      SIO_BROWSER_CDP_PUBLIC_HOST: ${SIO_BROWSER_CDP_PUBLIC_HOST:-browser}
      SIO_BROWSER_VNC_PORT: ${SIO_BROWSER_VNC_PORT:-6080}
    user: root
    command:
      [
        "/bin/sh",
        "-lc",
        "chown -R sio:sio /workspace/browser-profile && exec su sio -s /bin/sh -c 'python /workspace/scripts/run_docker_browser.py'",
      ]
    shm_size: "2gb"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - docker_browser_profile:/workspace/browser-profile
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9222/json/version', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment: *backend-environment
    volumes:
      - ./media:/workspace/media
    command:
      [
        "celery",
        "-A",
        "apps.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=4",
        "--queues=maintenance,monitoring,news,generation,automation,notification,video-search",
      ]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  subtitle-worker:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment: *backend-environment
    volumes:
      - ./media:/workspace/media
      - subtitle_models:/workspace/models
    command:
      [
        "celery",
        "-A",
        "apps.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=subtitle",
        "--concurrency=1",
        "--max-tasks-per-child=1",
      ]
    depends_on:
      api:
        condition: service_healthy
      translation:
        condition: service_healthy
    restart: unless-stopped

  translation:
    # Multi-platform index digest; update deliberately after a reviewed model/API upgrade.
    image: ${SIO_TRANSLATION_IMAGE:-libretranslate/libretranslate@sha256:1de2d7056bb8ad607a412f4563d9abe324ff632b43b5be9428bcc8e213aebb32}
    command:
      [
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--load-only",
        "en,zh,ja,ko,es,fr,de,pt",
        "--translation-cache",
        "all",
      ]
    volumes:
      - translation_models:/home/libretranslate/.local:rw
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment: *backend-environment
    command:
      [
        "celery",
        "-A",
        "apps.worker.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Content Intelligence OS}
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/login",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  proxy:
    image: caddy:2.10-alpine
    ports:
      # NOTE: host port 8080 was unreachable because Windows (Hyper-V/WinNAT)
      # reserves TCP 7998-8097. Using 8200 (outside the reserved range).
      - "8080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── LLM Gateway (New API) ───────────────────────────────────────────
  # Unified OpenAI-compatible gateway supporting 30+ official LLM providers.
  # Access the management UI on http://localhost:3306 to add API keys.
  llm-gateway:
    image: calciumion/new-api:latest
    ports:
      - "127.0.0.1:3306:3000"
    environment:
      SQL_DSN: ""
      REDIS_CONN_STRING: redis://redis:6379/1
      SESSION_SECRET: ${SIO_LLM_GATEWAY_SESSION_SECRET:-sio-llm-gateway-local-session}
      INITIAL_ROOT_TOKEN: ${SIO_LLM_GATEWAY_ROOT_TOKEN:-sio-local-gateway-token}
    volumes:
      - llm_gateway_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    profiles:
      - llm

  # ─── LLM Experimental (Chat2API / gpt4free) ─────────────────────────
  # Experimental web-to-API converter. NOT for production use.
  # Provides free access via web scraping — unstable, may violate ToS.
  # OpenAI-compatible API at http://llm-experimental:8080/v1
  llm-experimental:
    image: hlohaus789/g4f:latest
    shm_size: "2gb"
    ports:
      - "127.0.0.1:8020:8080"
      - "127.0.0.1:7900:7900"
    volumes:
      - llm_experimental_data:/app/har_and_cookies
    restart: unless-stopped
    profiles:
      - llm-experimental

volumes:
  postgres_data:
  redis_data:
  docker_browser_profile:
  llm_gateway_data:
  llm_experimental_data:
  subtitle_models:
  translation_models:
