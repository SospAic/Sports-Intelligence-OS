name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sports_intelligence
          POSTGRES_USER: sio
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sio -d sports_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SIO_ENVIRONMENT: test
      SIO_DATABASE_URL: postgresql+asyncpg://sio:ci-only-password@127.0.0.1:5432/sports_intelligence
      SIO_REDIS_URL: redis://127.0.0.1:6379/0
      SIO_SECRET_KEY: ci-only-secret-that-is-never-used-in-production
      SIO_SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Lint and format check
        working-directory: apps/api
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Type check
        working-directory: apps/api
        run: mypy app
      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head
      - name: Run backend tests
        working-directory: apps/api
        run: pytest
      - name: Run governance contract tests
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm --filter @sio/web build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
