name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sports_intelligence
          POSTGRES_USER: sio
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sio -d sports_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SIO_ENVIRONMENT: test
      SIO_DATABASE_URL: postgresql+asyncpg://sio:ci-only-password@127.0.0.1:5432/sports_intelligence
      SIO_REDIS_URL: redis://127.0.0.1:6379/0
      SIO_SECRET_KEY: ci-only-secret-that-is-never-used-in-production
      SIO_SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Validate Unix installer syntax
        run: bash -n scripts/install.sh scripts/install-linux.sh scripts/install-macos.sh scripts/install-common.sh
      - name: Lint and format check
        working-directory: apps/api
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Type check
        working-directory: apps/api
        run: mypy app
      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head
      - name: Run backend tests
        run: python scripts/run_api_test_shards.py --workdir apps/api --report artifacts/api-test-shards.txt
      - name: Upload API shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-shards
          path: artifacts/api-test-shards.txt
      - name: Run governance contract tests
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm --filter @sio/web build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Validate production configuration gate
        env:
          SIO_ENVIRONMENT: production
          SIO_SECRET_KEY: ci-production-secret-that-is-never-used
          SIO_DATABASE_URL: postgresql+asyncpg://sio:ci-production-password@db:5432/sports_intelligence
          SIO_SESSION_COOKIE_SECURE: "true"
          SIO_NOTIFICATION_ENCRYPTION_KEY: ci-production-notification-key-that-is-never-used
          SIO_TRANSLATION_IMAGE: libretranslate/libretranslate@sha256:1de2d7056bb8ad607a412f4563d9abe324ff632b43b5be9428bcc8e213aebb32
          SIO_LLM_INTERNAL_HOSTS_ALLOWLIST: '["llm-gateway"]'
        run: python scripts/validate_production_config.py
