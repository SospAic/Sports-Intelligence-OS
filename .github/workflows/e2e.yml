name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SIO_ENVIRONMENT: test
      POSTGRES_DB: sports_intelligence
      POSTGRES_USER: sio
      POSTGRES_PASSWORD: ci-only-password
      SIO_SECRET_KEY: ci-only-secret-that-is-never-used-in-production
      SIO_SESSION_COOKIE_SECURE: "false"
      SIO_BOOTSTRAP_ADMIN_EMAIL: admin@sportsintelligence.local
      SIO_BOOTSTRAP_ADMIN_PASSWORD: "CiOnly!Passw0rd#2026"
      SIO_BOOTSTRAP_WORKSPACE_NAME: "Sports Intelligence OS"
      E2E_ADMIN_EMAIL: admin@sportsintelligence.local
      E2E_ADMIN_PASSWORD: "CiOnly!Passw0rd#2026"
      E2E_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      # ─── Infrastructure ────────────────────────────────────────────────
      - name: Start infrastructure services
        run: |
          docker compose up -d postgres redis
          echo "Waiting for postgres..."
          until docker compose exec -T postgres pg_isready -U sio -d sports_intelligence; do
            sleep 2
          done
          echo "Waiting for redis..."
          until docker compose exec -T redis redis-cli ping | grep -q PONG; do
            sleep 1
          done
          echo "Infrastructure ready."

      # ─── Backend (API + migrations + seed) ─────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e "apps/api[dev]"

      - name: Run database migrations
        working-directory: apps/api
        env:
          SIO_DATABASE_URL: postgresql+asyncpg://sio:ci-only-password@127.0.0.1:5432/sports_intelligence
          SIO_REDIS_URL: redis://127.0.0.1:6379/0
        run: alembic upgrade head

      - name: Bootstrap admin user
        working-directory: apps/api
        env:
          SIO_DATABASE_URL: postgresql+asyncpg://sio:ci-only-password@127.0.0.1:5432/sports_intelligence
          SIO_REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m app.cli bootstrap-admin

      - name: Seed demo data
        working-directory: apps/api
        env:
          SIO_DATABASE_URL: postgresql+asyncpg://sio:ci-only-password@127.0.0.1:5432/sports_intelligence
          SIO_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python -m app.cli seed-platforms
          python -m app.cli seed-news-sources

      - name: Start API server
        working-directory: apps/api
        env:
          SIO_DATABASE_URL: postgresql+asyncpg://sio:ci-only-password@127.0.0.1:5432/sports_intelligence
          SIO_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)" 2>/dev/null; then
              echo "API ready."
              break
            fi
            sleep 2
          done

      # ─── Frontend ──────────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        run: pnpm --filter @sio/web build

      - name: Start Next.js server
        working-directory: apps/web
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: |
          pnpm start --port 3000 &
          echo "Waiting for Next.js..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/login > /dev/null 2>&1; then
              echo "Next.js ready."
              break
            fi
            sleep 2
          done

      # ─── Playwright ────────────────────────────────────────────────────
      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: apps/web
        run: pnpm exec playwright test --project=desktop --project=tablet --project=mobile

      # ─── Artifacts ─────────────────────────────────────────────────────
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/web/test-results/**/screenshots/
          retention-days: 14
          if-no-files-found: ignore
