[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-intelligence-api"
version = "0.1.0"
description = "Sports Intelligence OS API and worker shared package"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "cryptography>=45,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.28,<1",
  "playwright>=1.52,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "redis>=6.2,<7",
  "sqlalchemy>=2.0.41,<2.1",
  "beautifulsoup4>=4.13,<5",
  "yt-dlp>=2025.1,<2027",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.16,<2",
  # psycopg v3's binary extra bundles a prebuilt libpq so ``import psycopg``
  # works on the slim base image (which ships no system libpq and no
  # psycopg_c compiler). Without it the whole pytest suite fails at the
  # autouse DB fixture with "no pq wrapper available". The runtime path uses
  # asyncpg, so this only affects the test environment.
  "psycopg[binary]>=3.2,<4",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore:The 'app' shortcut is now deprecated:DeprecationWarning",
  "ignore:Use 'content=<...>' to upload raw bytes text content:DeprecationWarning",
]
markers = [
  "integration: multi-service integration tests that use local deterministic providers",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
